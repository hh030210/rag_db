qdrant:
  storage:
    # /qdrant/storage 是容器内路径，已经通过 docker compose 绑定到 /mnt/qdrant_storage
    uri: /qdrant/storage
  service:
    host: 0.0.0.0
    http_port: 6333
    grpc_port: 6334
    enable_cors: true
    api_key: ""
    read_only_api: false
  log_level: INFO
  hnsw_config:
    m: 16
    ef_construct: 512
  optimizers_config:
    default_segment_number: 2
